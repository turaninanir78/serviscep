name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serviscep
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: serviscep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviscep -d serviscep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Bu degerlerin hicbiri gercek degil - sadece bu CI calismasi icin
      # uretilmis, tek kullanimlik sahte degerler (WHATSAPP_TOKEN_ENCRYPTION_KEY
      # dahil - gecerli bir Fernet anahtari OLMASI gerekiyor ama gercek hicbir
      # WhatsApp hesabina bagli degil). Gercek prod secret'lari asla buraya
      # girmez, bu yuzden GitHub Actions secrets kullanmaya gerek yok.
      DATABASE_URL: postgresql://serviscep:ci-test-password@localhost:5432/serviscep
      JWT_SECRET_KEY: ci-test-jwt-secret-do-not-use-in-prod
      WHATSAPP_TOKEN_ENCRYPTION_KEY: KTsQ0-_aVcETaWpV3ViLder3yZgFymxgyC7oDvEBVeM=
      PII_ENCRYPTION_KEY: Ly1msJHMZKqcSzS7mrjC-MCLRLtyQR06TuYqaeBlEFA=
      WHATSAPP_APP_SECRET: ci-test-app-secret
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-test-verify-token
      COOKIE_SECURE: "false"
      CORS_ALLOW_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      # test_appointment_race_condition.py, test_auth_cookie.py ve
      # test_webhooks.py, calisan gercek bir sunucuya HTTP istegi atiyor
      # (bkz. bu dosyalardaki BASE_URL = "http://localhost:8000") - bu
      # yuzden pytest'ten once API'yi arka planda ayaga kaldirmamiz gerekiyor.
      - name: Start API server in background
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for API server to be ready
        run: timeout 30 bash -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'

      - name: Run pytest
        run: pytest -v

      - name: Show API server log on failure
        if: failure()
        run: cat /tmp/uvicorn.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --ci: jest'i etkilesimli olmayan, CI'a uygun modda calistirir (orn.
      # eksik snapshot'lari otomatik olusturmak yerine basarisiz sayar).
      - name: Run jest suite
        run: npm test -- --ci

      # Jest, Babel uzerinden transpile ediyor - tip hatalarini YAKALAMAZ.
      # Bu adim olmadan bozuk bir tip degisikligi (orn. api.ts'deki bir
      # fonksiyon imzasi) testler gecse bile fark edilmeden mergelenebilirdi.
      - name: Type-check
        run: npm run typecheck
